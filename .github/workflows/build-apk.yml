name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📥 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Generate Native Android Code (Expo Prebuild)
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --clean --no-interactive

      - name: 🔨 Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-APK
          path: android/app/build/outputs/apk/release/app-release.apk
